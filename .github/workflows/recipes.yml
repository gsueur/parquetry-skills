name: recipes

# Every recipe in the skill runs against the live datasets. The data moves
# under them (OSM nightly, FEMA daily, GMWID weekly), so this catches a
# change that breaks a query before someone's agent does.
on:
  # Every branch, not only main: the push gives a PR's head commit the
  # required `recipes` check even when GitHub does not fire the
  # pull_request event (it skipped it on PRs #1 and #2).
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Manifests parse
        run: python3 -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
      - name: Recipes
        run: uv run tests/check_recipes.py --slow
      - name: locate.py
        run: uv run skills/reference-data/scripts/locate.py 2.3522 48.8566 | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['admin']['iso3_code']=='FRA' and d['land_cover']['clc_code'], d"
      - name: write_geoparquet.py
        run: |
          S=skills/write-geoparquet/scripts/write_geoparquet.py
          # lon/lat, partitioned, from a URL
          uv run $S "https://parquetry.geomermaids.com/gaul/2024/country=FRA/L2.parquet" out_fra --partition-by gaul1_name --name L2
          test -f out_fra/_manifest.json
          # projected CRS (EPSG:3035), subdivided: the CRS must survive the rewrite
          uv run $S "https://parquetry.geomermaids.com/clc/2018/country=LU/clc_2018.parquet" out_lu.parquet --subdivide 256
          uv run --with duckdb python -c "import duckdb; duckdb.sql(\"INSTALL spatial; LOAD spatial\"); t = duckdb.sql(\"SELECT any_value(typeof(geometry)), max(ST_NPoints(geometry)) FROM read_parquet('out_lu.parquet')\").fetchone(); assert t == (\"GEOMETRY('EPSG:3035')\", 256), t"
